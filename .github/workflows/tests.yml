name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The C# protocol layer is built and driven by tests/test_dotnet_interop.py.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,lint]"
      - name: Test
        # Live CARLA and Unity tests skip without EMBODIED_UI_CARLA / EMBODIED_UI_UNITY.
        run: python -m pytest tests -q
      - name: Lint
        run: python -m ruff check src tests examples
      - name: Types
        run: python -m mypy src/embodied_ui --ignore-missing-imports
      - name: Build
        run: python -m build
